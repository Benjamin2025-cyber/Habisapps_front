name: ci

on:
  # Manual trigger, so CI can be re-run without inventing a commit. Also the
  # fastest way to tell a delivery problem from a disabled one: if a dispatch
  # runs but a push does not, push events are not reaching Actions; if neither
  # runs, Actions is off for the repository or the account.
  #
  # Note `deploy` keys off `workflow_run` of this workflow, so a successful
  # manual run on main deploys too — which for main is the same code the server
  # already holds (deploy resets to origin/main), so it is a rebuild, not a
  # surprise release.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pin here — pnpm/action-setup reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          HABIS_API_ORIGIN: http://localhost:8000
          NEXT_PUBLIC_API_VERSION: '1'
